<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>A Doceria | Karla Tavares</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">K. TAVARES <span>PÂTISSERIE</span></a>
        <nav><ul><li><a href="index.html">VOLTAR</a></li></ul></nav>
    </header>
    <div class="container">
        <h2 class="section-title">A DOCERIA</h2>
        <div class="grid">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1541696490-8744a5db0228?w=300">
                <h4>Mini Brownie</h4>
                <p class="price">R$ 3,50</p>
                <button class="btn" onclick="add('Mini Brownie', 3.50)">ADICIONAR</button>
            </div>
            </div>
    </div>
    <div id="cart" class="cart-float" onclick="checkout()">🛒 FINALIZAR (<span id="c">0</span>)</div>
    <script>
        let cart = [];
        function add(n,p){ cart.push({n,p}); document.getElementById('c').innerText = cart.length; document.getElementById('cart').style.display='block'; }
        function checkout(){ 
            let msg = "Olá! Gostaria de pedir:\n";
            cart.forEach(i => msg += `- ${i.n}\n`);
            window.open(`https://api.whatsapp.com/send?phone=5521995805279&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
