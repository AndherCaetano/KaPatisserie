<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karla Tavares Pâtisserie | Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* DESIGN DE LUXO - KARLA TAVARES */
        :root {
            --marrom: #4a3728;
            --dourado: #c5a059;
            --bege: #fdf8f2;
            --branco: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: var(--bege); font-family: 'Poppins', sans-serif; color: var(--marrom); overflow-x: hidden; }

        /* HEADER REFINADO */
        header {
            background: var(--branco);
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f0efed;
        }

        .logo-inicio { display: flex; align-items: center; gap: 10px; }
        .logo-inicio span { color: var(--dourado); font-weight: 600; text-transform: uppercase; font-size: 0.9rem; }

        nav ul { display: flex; list-style: none; gap: 30px; }
        nav a { text-decoration: none; color: var(--marrom); font-weight: 400; font-size: 0.85rem; text-transform: uppercase; }

        .brand-right { text-align: right; }
        .brand-right h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; line-height: 1; }
        .brand-right p { font-size: 0.6rem; letter-spacing: 3px; color: var(--dourado); text-transform: uppercase; }

        /* HERO SECTION - COMPOSIÇÃO IGUAL AO PROJETO */
        .hero {
            height: 80vh;
            background-color: #fdfcfb;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center;
        }

        /* O PISO DE MADEIRA (IGUAL À IMAGEM 1) */
        .wood-floor {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 160px;
            /* Degradê de madeira com textura */
            background: linear-gradient(to bottom, #d2b48c 0%, #a67c52 100%);
            border-top: 1px solid rgba(0,0,0,0.1);
            z-index: 1;
        }
        /* Efeito de tábuas no piso */
        .wood-floor::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: repeating-linear-gradient(90deg, transparent, transparent 150px, rgba(0,0,0,0.05) 151px);
        }

        /* ELEMENTOS FLUTUANTES */
        .bolo-esquedo {
            position: absolute;
            left: 5%; bottom: 40px;
            height: 420px;
            z-index: 10;
            filter: drop-shadow(10px 20px 30px rgba(0,0,0,0.1));
        }

        .potes-direito {
            position: absolute;
            right: 5%; bottom: 40px;
            height: 350px;
            z-index: 10;
            filter: drop-shadow(-10px 20px 30px rgba(0,0,0,0.1));
        }

        /* CONTEÚDO CENTRAL */
        .hero-content {
            z-index: 20;
            max-width: 850px;
            margin-bottom: 80px;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--marrom);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .hero-content p {
            font-size: 1.2rem;
            color: #777;
            margin-bottom: 35px;
            font-weight: 300;
        }

        .btn-trabalho {
            background: var(--dourado);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: 0.3s;
        }
        .btn-trabalho:hover { transform: scale(1.05); background: var(--marrom); }

        @media (max-width: 1024px) {
            .bolo-esquedo, .potes-direito { display: none; }
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-inicio">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#c5a059" stroke-width="2"><path d="M12 2L12 22M12 22L2 12M12 22L22 12"/></svg>
            <span>Início</span>
        </div>
        
        <nav>
            <ul>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="kits.html">Portfólio</a></li>
                <li><a href="contato.html">Contato</a></li>
            </ul>
        </nav>

        <div class="brand-right">
            <h2>Karla Tavares</h2>
            <p>Pâtisserie</p>
        </div>
    </header>

    <section class="hero">
        <img src="https://images.unsplash.com/photo-1535254973040-607b474cb80d?q=80&w=600" class="bolo-esquedo" alt="Bolo de Luxo">

        <div class="hero-content">
            <h1>Arte em Cada Doce.<br>Karla Tavares Pâtisserie.</h1>
            <p>Confeitaria artesanal sofisticada no Rio de Janeiro.<br>De bolos monumentais a doces individuais perfeitos.</p>
            <a href="kits.html" class="btn-trabalho">Conheça nosso trabalho</a>
        </div>

        <img src="https://images.unsplash.com/photo-1541696490-8744a5db0228?q=80&w=400" class="potes-direito" alt="Doces no Pote">

        <div class="wood-floor"></div>
    </section>

</body>
</html>
