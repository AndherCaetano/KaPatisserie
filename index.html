<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karla Tavares Pâtisserie</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <header>
        <div class="header-container">
            <div class="header-left">
                <img src="imagens/Folha logo.png" alt="Folha" class="folha-img">
                
                <button class="menu-toggle" aria-label="Abrir Menu">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <nav class="nav-menu">
                    <ul>
                        <li><a href="index.html" class="active">Início</a></li>
                        <li><a href="sobre.html">Sobre</a></li>
                        <li><a href="portfolio.html">Portfólio</a></li>
                        <li><a href="contato.html">Contato</a></li>
                    </ul>
                </nav>
            </div>
            
            <div class="header-right">
                <img src="imagens/assinatura logo.png" alt="Karla Tavares" class="assinatura-img">
            </div>
        </div>
    </header>

    <section class="hero">
        <img src="imagens/bolo capa.png" class="product left-cake" alt="Bolo de Casamento">

        <div class="hero-content">
            <h1>Arte em cada doce. <br>Karla Tavares Pâtisserie.</h1>
            <p>Confeitaria artesanal sofisticada no Rio de Janeiro. <br>De bolos monumentais a doces individuais perfeitos.</p>
            <a href="portfolio.html" class="btn-cta">CONHEÇA NOSSO TRABALHO</a>
        </div>

        <img src="imagens/potes.png" class="product right-jars" alt="Potes Gourmet">

        <div class="wood-table"></div>
    </section>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        menuToggle.addEventListener('click', () => {
            navMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
