<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Encomendas | Karla Tavares</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">K. TAVARES <span>PÂTISSERIE</span></a>
        <nav><ul><li><a href="index.html">VOLTAR</a></li></ul></nav>
    </header>
    <div class="container">
        <h2 class="section-title">FAÇA SUA ENCOMENDA</h2>
        <div style="max-width: 500px; margin: 0 auto; text-align: left; background: white; padding: 30px; border-radius: 15px;">
            <p>Nome: <input type="text" id="n" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ddd;"></p>
            <p>Data do Evento: <input type="date" id="d" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ddd;"></p>
            <p>Tipo de Doce: <input type="text" id="t" style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #ddd;"></p>
            <button class="btn" onclick="send()" style="width:100%;">PEDIR ORÇAMENTO</button>
        </div>
        <div style="margin-top: 40px;">
            <h3>(21) 99580-5279</h3>
            <p>📍 Rio de Janeiro</p>
        </div>
    </div>
    <script>
        function send(){
            const n = document.getElementById('n').value;
            const d = document.getElementById('d').value;
            const t = document.getElementById('t').value;
            const msg = `Olá! Meu nome é ${n}. Gostaria de um orçamento para ${t} na data ${d}.`;
            window.open(`https://api.whatsapp.com/send?phone=5521995805279&text=${encodeURIComponent(msg)}`);
        }
    </script>
</body>
</html>
